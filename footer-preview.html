<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>白玉楼 · Footer Preview</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #080d16;
        --panel: #101827;
        --text: #f6f8ff;
        --muted: #8f9bb3;
        --line: rgba(111, 238, 207, .22);
        --cyan: #6feecf;
        --pink: #ff83b7;
      }

      * { box-sizing: border-box; }

      body[data-theme="light"] { --bg: #f4eff5; }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 0;
        display: flex;
        align-items: flex-end;
        justify-content: stretch;
        overflow: hidden;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 75% 12%, rgba(111, 238, 207, .12), transparent 24rem),
          radial-gradient(circle at 15% 85%, rgba(255, 131, 183, .12), transparent 25rem),
          var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body::before {
        position: fixed;
        inset: 0;
        background-image: linear-gradient(rgba(255, 255, 255, .035) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .035) 1px, transparent 1px);
        background-size: 2.75rem 2.75rem;
        mask-image: linear-gradient(to bottom, black, transparent 75%);
        content: "";
        pointer-events: none;
      }

      .theme-toggle {
        position: fixed;
        top: 1.25rem;
        right: 1.25rem;
        z-index: 5;
        border: 1px solid rgba(239, 155, 187, .45);
        border-radius: 999px;
        padding: .55rem .8rem;
        background: rgba(255, 255, 255, .68);
        color: #66566f;
        cursor: pointer;
        font: 700 .75rem/1 ui-monospace, SFMono-Regular, Consolas, monospace;
        box-shadow: 0 8px 22px rgba(113, 86, 126, .12);
        backdrop-filter: blur(12px);
      }

      .theme-toggle:hover { border-color: #58c9b0; color: #3da98e; }

      .footer {
        position: relative;
        width: 100%;
        max-width: none;
        min-width: 0;
        box-sizing: border-box;
        overflow: hidden;
        --footer-text: #66566f;
        --footer-muted: #9b8da4;
        --footer-mint: #58c9b0;
        --footer-pink: #ef9bbb;
        border: 0;
        border-top: 1px solid rgba(239, 155, 187, .38);
        border-radius: 0;
        background: radial-gradient(circle at 88% 14%, rgba(255, 216, 231, .58), transparent 12rem), radial-gradient(circle at 8% 92%, rgba(199, 246, 235, .68), transparent 16rem), radial-gradient(circle at 1rem 1rem, rgba(239, 155, 187, .12) 1.5px, transparent 1.6px), linear-gradient(135deg, #fffdfd, #fff7fb 48%, #f5fffb);
        background-size: auto, auto, 1.5rem 1.5rem, auto;
        box-shadow: 0 -14px 45px rgba(113, 86, 126, .1);
        color: var(--footer-text);
        isolation: isolate;
      }

      .footer::before,
      .footer::after {
        position: absolute;
        z-index: -1;
        width: 19rem;
        height: 19rem;
        border-radius: 50%;
        content: "";
        filter: blur(70px);
        pointer-events: none;
      }

      .footer::before { top: -11rem; right: 12%; background: rgba(255, 194, 217, .3); }
      .footer::after { bottom: -12rem; left: 8%; background: rgba(174, 239, 220, .3); }

      .footer-inner { width: min(100%, 1080px); margin: 0 auto; padding: 3.2rem 3rem 2rem; }

      .footer-main,
      .footer-bottom {
        display: grid;
        grid-template-columns: minmax(0, 1.2fr) minmax(0, .8fr);
        min-width: 0;
        gap: 3rem;
      }

      .footer-main > *, .footer-bottom > * { min-width: 0; }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: .55rem;
        margin: 0 0 .9rem;
        color: var(--footer-muted);
        font: 800 .7rem/1.4 ui-monospace, SFMono-Regular, Consolas, monospace;
        letter-spacing: .16em;
        text-transform: uppercase;
      }

      .status-dot {
        width: .5rem;
        height: .5rem;
        border-radius: 50%;
        background: var(--footer-mint);
        box-shadow: 0 0 13px var(--footer-mint);
      }

      .brand-row { display: flex; align-items: center; gap: .9rem; }

      .brand-mark {
        position: relative;
        display: grid;
        width: 3.6rem;
        height: 3.6rem;
        place-items: center;
        border-radius: 1.15rem .55rem 1.15rem .55rem;
        background: radial-gradient(circle at 32% 25%, rgba(255, 255, 255, .82), transparent 13%), radial-gradient(circle at 68% 70%, rgba(255, 191, 217, .72), transparent 36%), linear-gradient(145deg, rgba(178, 241, 224, .9), rgba(172, 229, 219, .28) 54%, rgba(255, 194, 218, .64));
        box-shadow: inset 0 0 22px rgba(255, 255, 255, .55), 0 0 25px rgba(111, 196, 177, .24), 0 0 48px rgba(239, 155, 187, .16);
        color: #ffffff;
        filter: drop-shadow(0 0 9px rgba(111, 196, 177, .28));
        font-size: 1.75rem;
        font-weight: 900;
        text-shadow: 0 0 9px rgba(8, 13, 22, .9), 0 0 18px rgba(247, 255, 255, .75);
        animation: spirit-core 4.2s ease-in-out infinite;
      }

      .brand-mark::before,
      .brand-mark::after {
        position: absolute;
        content: "";
        pointer-events: none;
      }

      .brand-mark::before {
        top: .55rem;
        right: .65rem;
        width: .32rem;
        height: .32rem;
        border-radius: 50%;
        background: #ffffff;
        box-shadow: 0 0 9px #ffffff, -1.5rem 1.55rem 0 -.08rem var(--footer-pink);
      }

      .brand-mark::after {
        bottom: .65rem;
        left: .65rem;
        width: 1rem;
        height: .12rem;
        border-radius: 999px;
        background: rgba(255, 255, 255, .9);
        box-shadow: 0 0 8px rgba(255, 255, 255, .8);
        transform: rotate(-36deg);
      }

      @keyframes spirit-core {
        0%, 100% { transform: translateY(0) rotate(-2deg) scale(1); }
        50% { transform: translateY(-4px) rotate(2deg) scale(1.035); }
      }

      h1 {
        display: flex;
        margin: 0;
        color: transparent;
        font-family: "STKaiti", "KaiTi", "FZKai-Z03", "DFKai-SB", serif;
        font-size: clamp(2.6rem, 6vw, 4.4rem);
        font-weight: 700;
        letter-spacing: .12em;
        line-height: 1;
        -webkit-text-stroke: 1px rgba(88, 201, 176, .28);
        background: linear-gradient(110deg, var(--footer-mint) 12%, #ffffff 38%, var(--footer-pink) 52%, var(--footer-mint) 86%);
        background-size: 220% auto;
        -webkit-background-clip: text;
        background-clip: text;
        filter: drop-shadow(0 0 10px rgba(111, 196, 177, .28)) drop-shadow(0 0 24px rgba(239, 155, 187, .18));
        animation: title-shimmer 5s linear infinite, title-breathe 3.8s ease-in-out infinite;
      }

      h1 .char {
        display: inline-block;
        animation: title-float 3.8s ease-in-out infinite;
      }

      h1 .char:nth-child(2) { animation-delay: .18s; }
      h1 .char:nth-child(3) { animation-delay: .36s; }

      @keyframes title-shimmer {
        to { background-position: 220% center; }
      }

      @keyframes title-breathe {
        0%, 100% { filter: drop-shadow(0 0 10px rgba(111, 238, 207, .38)) drop-shadow(0 0 22px rgba(255, 131, 183, .12)); }
        50% { filter: drop-shadow(0 0 17px rgba(111, 238, 207, .62)) drop-shadow(0 0 34px rgba(255, 131, 183, .26)); }
      }

      @keyframes title-float {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-4px) rotate(-1deg); }
      }
      .tagline { max-width: 31rem; margin: 1.2rem 0 0; color: var(--footer-muted); font-size: 1rem; line-height: 1.8; }
      .code-line { display: flex; flex-wrap: wrap; gap: .7rem; margin: 1.45rem 0 0; color: var(--footer-mint); font: 700 .68rem/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: .12em; overflow-wrap: anywhere; }

      .contact { min-width: 0; text-align: right; }
      .contact .eyebrow { justify-content: flex-end; }
      .socials { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: .7rem; margin: 0; padding: 0; list-style: none; }
      .socials a { display: grid; width: 3.2rem; height: 3.2rem; place-items: center; border: 1px solid rgba(239, 155, 187, .38); border-radius: 1rem; background: rgba(255, 255, 255, .58); color: var(--footer-text); font-weight: 800; text-decoration: none; transition: .2s ease; box-shadow: 0 8px 18px rgba(142, 110, 140, .08); }
      .socials a:hover { border-color: var(--footer-mint); background: rgba(220, 251, 243, .9); box-shadow: 0 0 24px rgba(111, 196, 177, .2); color: #3da98e; transform: translateY(-3px); }
      .socials svg { width: 1.45rem; height: 1.45rem; fill: currentColor; }
      .socials .mail-icon { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.7; }
      .socials .qq-penguin { width: 1.8rem; height: 1.8rem; }

      .tools { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: .6rem; margin-top: 1.25rem; color: var(--footer-muted); font: .76rem/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; }
      .tools a { color: inherit; text-decoration: none; }
      .tools a:hover { color: #3da98e; }

      .footer-bottom { margin-top: 2.6rem; padding-top: 1.5rem; border-top: 1px solid rgba(255, 255, 255, .12); }
      .copyright, .meta, .status { margin: 0; color: var(--footer-muted); font-size: .8rem; line-height: 1.6; }
      .copyright { color: var(--footer-text); font-weight: 800; }
      .legal { display: flex; flex-direction: column; gap: .5rem; }
      .meta a { color: #3da98e; text-decoration: underline; text-underline-offset: .2em; }
      .status { display: flex; flex-direction: column; align-items: flex-end; gap: .45rem; text-align: right; }
      .status strong { color: #3da98e; }

      @media (max-width: 820px) {
        body { padding: 0; }
        .footer-inner { padding: 2.3rem 1.25rem 1.5rem; }
        .footer-main, .footer-bottom { grid-template-columns: 1fr; gap: 2rem; }
        .contact, .status { align-items: flex-start; text-align: left; }
        .contact .eyebrow, .socials, .tools { justify-content: flex-start; }
      }

      @media (prefers-reduced-motion: reduce) {
        h1, h1 .char, .brand-mark { animation: none; }
      }

      body[data-theme="dark"] {
        --bg: #080d16;
      }

      body[data-theme="dark"] .theme-toggle {
        border-color: rgba(111, 238, 207, .3);
        background: rgba(16, 24, 39, .75);
        color: #d9fff6;
      }

      body[data-theme="dark"] .footer {
        --footer-text: #f6f8ff;
        --footer-muted: #9da9be;
        --footer-mint: #6feecf;
        --footer-pink: #ff83b7;
        border-top: 1px solid rgba(111, 238, 207, .24);
        background: radial-gradient(circle at 88% 14%, rgba(111, 238, 207, .14), transparent 15rem), radial-gradient(circle at 8% 92%, rgba(255, 131, 183, .11), transparent 17rem), linear-gradient(135deg, #101827, #111827 48%, #0d1421);
        box-shadow: 0 -14px 45px rgba(0, 0, 0, .28), 0 0 42px rgba(111, 238, 207, .08);
      }

      body[data-theme="dark"] .footer::before { background: rgba(111, 238, 207, .14); }
      body[data-theme="dark"] .footer::after { background: rgba(255, 131, 183, .12); }
      body[data-theme="dark"] .brand-mark { background: radial-gradient(circle at 32% 25%, rgba(247, 255, 255, .65), transparent 13%), radial-gradient(circle at 68% 70%, rgba(255, 131, 183, .52), transparent 36%), linear-gradient(145deg, rgba(111, 238, 207, .75), rgba(111, 238, 207, .08) 54%, rgba(255, 131, 183, .3)); box-shadow: inset 0 0 22px rgba(247, 255, 255, .18), 0 0 25px rgba(111, 238, 207, .24), 0 0 48px rgba(255, 131, 183, .1); color: var(--footer-mint); }
      body[data-theme="dark"] .socials a { border-color: rgba(111, 238, 207, .28); background: rgba(8, 13, 22, .38); color: var(--footer-text); box-shadow: none; }
      body[data-theme="dark"] .socials a:hover { border-color: var(--footer-mint); background: rgba(111, 238, 207, .16); color: var(--footer-mint); }
      body[data-theme="dark"] .socials .qq-cutout { fill: rgba(8, 13, 22, .9); }
    </style>
  </head>

    </footer>
    <script>
      const body = document.body;
      const toggle = document.querySelector('.theme-toggle');
      const savedTheme = localStorage.getItem('footer-preview-theme');
      if (savedTheme === 'dark' || savedTheme === 'light') body.dataset.theme = savedTheme;

      function syncThemeButton() {
        const isDark = body.dataset.theme === 'dark';
        toggle.textContent = isDark ? '切换浅色主题' : '切换暗色主题';
        toggle.setAttribute('aria-label', toggle.textContent);
      }

      syncThemeButton();
      toggle.addEventListener('click', () => {
        body.dataset.theme = body.dataset.theme === 'dark' ? 'light' : 'dark';
        localStorage.setItem('footer-preview-theme', body.dataset.theme);
        syncThemeButton();
      });
    </script>
