name: 刷新节假日缓存

on:
  schedule:
    # 每周一 02:00 UTC（北京时间 10:00）刷新一次
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-holiday-cache
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    name: Refresh holiday cache
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh holiday cache
        run: pnpm exec tsx scripts/update-holiday-cache.ts

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- src/data/holiday-api.json; then
            echo "缓存无变化，无需提交"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/holiday-api.json
            git commit -m "chore: 刷新节假日静态缓存"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
