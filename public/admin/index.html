<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>博客管理</title>
  <style>
    :root {
      --color-background: #0b0b0b;
      --color-text: #eee;
      --color-primary: #7c3aed;
      --color-text-light: #9ca3af;
      --color-input-bg: #1a1a1a;
      --color-input-border: #333;
    }

    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      background: url('https://image.hakugyokurou.fun/file/1784904548543_1.jpg') no-repeat center center fixed;
      background-size: cover;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: inherit;
      background-size: cover;
      background-attachment: fixed;
      background-position: center;
      filter: blur(8px);
      z-index: -1;
    }

    /* 文章列表条目链接 - Decap CMS 通过 emotion 生成哈希类名 */
    a[href*="entries/"],
    a[role="button"][tabindex],
    [data-testid="entry-card"],
    [data-testid*="entry"] {
      transition: all 0.25s ease !important;
      border-radius: 10px !important;
    }
    a[href*="entries/"]:hover,
    a[role="button"][tabindex]:hover {
      transform: translateY(-1px) !important;
      background: rgba(124, 58, 237, 0.08) !important;
      backdrop-filter: blur(12px) !important;
      -webkit-backdrop-filter: blur(12px) !important;
      box-shadow: 0 4px 20px rgba(124, 58, 237, 0.12) !important;
    }

    /* 网格布局中的卡片容器 */
    [class*="Grid"] > a,
    section a[style*="relative"] {
      transition: all 0.25s ease !important;
      border-radius: 10px !important;
    }
    [class*="Grid"] > a:hover,
    section a[style*="relative"]:hover {
      transform: translateY(-1px) !important;
      background: rgba(124, 58, 237, 0.06) !important;
      backdrop-filter: blur(10px) !important;
    }
  </style>
</head>
<body>
  <script src="/admin/decap-cms.js"></script>
  <script>
    (function() {
      var CATEGORIES = ['ai', 'projects', 'others', '学习文档', '示例'];
      // 创建 datalist 元素
      var datalist = document.createElement('datalist');
      datalist.id = 'cms-category-list';
      CATEGORIES.forEach(function(cat) {
        var opt = document.createElement('option');
        opt.value = cat;
        datalist.appendChild(opt);
      });
      document.body.appendChild(datalist);
      // 监听 CMS 渲染的分类输入框，关联 datalist
      var observer = new MutationObserver(function() {
        document.querySelectorAll('input[name="category"]').forEach(function(input) {
          if (!input.hasAttribute('list')) {
            input.setAttribute('list', 'cms-category-list');
          }
        });
      });
      observer.observe(document.body, { childList: true, subtree: true });
    })();
  </script>
</body>
</html>
