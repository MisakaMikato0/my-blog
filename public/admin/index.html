<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>博客管理</title>
  <style>
    :root {
      --color-background: #0b0b0b;
      --color-text: #eee;
      --color-primary: #7c3aed;
      --color-text-light: #9ca3af;
      --color-input-bg: #1a1a1a;
      --color-input-border: #333;
    }

    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: url('https://image.hakugyokurou.fun/file/1784904548543_1.jpg') no-repeat center center fixed;
      background-size: cover;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: url('https://image.hakugyokurou.fun/file/1784904548543_1.jpg') no-repeat center center fixed;
      background-size: cover;
      filter: blur(8px);
      z-index: -1;
    }

    /* 文章列表条目链接 - Decap CMS 通过 emotion 生成哈希类名 */
    a[href*="entries/"],
    a[role="button"][tabindex],
    [data-testid="entry-card"],
    [data-testid*="entry"] {
      transition: all 0.25s ease !important;
      border-radius: 10px !important;
    }
    a[href*="entries/"]:hover,
    a[role="button"][tabindex]:hover {
      transform: translateY(-1px) !important;
      background: rgba(124, 58, 237, 0.08) !important;
      backdrop-filter: blur(12px) !important;
      -webkit-backdrop-filter: blur(12px) !important;
      box-shadow: 0 4px 20px rgba(124, 58, 237, 0.12) !important;
    }

    /* 网格布局中的卡片容器 */
    [class*="Grid"] > a,
    section a[style*="relative"] {
      transition: all 0.25s ease !important;
      border-radius: 10px !important;
    }
    [class*="Grid"] > a:hover,
    section a[style*="relative"]:hover {
      transform: translateY(-1px) !important;
      background: rgba(124, 58, 237, 0.06) !important;
      backdrop-filter: blur(10px) !important;
    }
  </style>
</head>
<body>
  <script src="/admin/decap-cms.js"></script>
  <script>
    (function() {
      var CATEGORIES = ['ai', 'projects', 'others', '学习文档', '示例'];

      CMS.registerWidget('category-select', window.createClass({
        getInitialState: function() {
          return { isOpen: false, value: this.props.value || '' };
        },
        handleChange: function(e) {
          var val = e.target.value;
          this.setState({ value: val });
          this.props.onChange(val);
        },
        toggleOpen: function() {
          this.setState({ isOpen: !this.state.isOpen });
        },
        selectOption: function(opt) {
          this.setState({ value: opt, isOpen: false });
          this.props.onChange(opt);
        },
        handleBlur: function(e) {
          var self = this;
          setTimeout(function() { self.setState({ isOpen: false }); }, 150);
        },
        render: function() {
          var h = window.h;
          var value = this.state.value;
          var isOpen = this.state.isOpen;
          var filtered = CATEGORIES.filter(function(c) {
            return !value || c.indexOf(value) !== -1;
          });

          return h('div', { style: { position: 'relative', width: '100%' } },
            h('div', { style: { display: 'flex', alignItems: 'center' } },
              h('input', {
                type: 'text',
                value: value,
                onChange: this.handleChange,
                onFocus: this.toggleOpen,
                onBlur: this.handleBlur,
                placeholder: '选择或输入分类',
                style: {
                  width: '100%', padding: '8px 12px', fontSize: '14px',
                  background: '#1a1a1a', color: '#eee', borderRadius: '4px',
                  border: '1px solid #333', boxSizing: 'border-box', outline: 'none'
                }
              }),
              h('button', {
                type: 'button',
                onClick: this.toggleOpen,
                style: {
                  position: 'absolute', right: '4px', top: '50%',
                  transform: 'translateY(-50%)',
                  background: 'none', border: 'none', color: '#9ca3af',
                  cursor: 'pointer', padding: '4px 8px', fontSize: '12px'
                }
              }, isOpen ? '▲' : '▼')
            ),
            isOpen && filtered.length ? h('ul', { style: {
              position: 'absolute', top: '100%', left: '0', right: '0',
              margin: '2px 0 0 0', padding: '4px 0',
              background: '#1a1a1a', border: '1px solid #333',
              borderRadius: '4px', zIndex: '9999',
              listStyle: 'none', maxHeight: '200px', overflowY: 'auto'
            } },
              filtered.map(function(opt) {
                var selected = opt === value;
                return h('li', {
                  key: opt,
                  onMouseDown: function() { this.selectOption(opt); }.bind(this),
                  style: {
                    padding: '6px 12px', cursor: 'pointer',
                    background: selected ? 'rgba(124,58,237,0.2)' : 'transparent',
                    color: selected ? '#a78bfa' : '#eee', fontSize: '14px'
                  }
                }, opt);
              }.bind(this))
            ) : null
          );
        }
      }));
    })();
  </script>
</body>
</html>
